name: Update "latest" release

on:
  workflow_dispatch: # Permite ejecutarlo manualmente
  push:
    paths:
      - 'lang/**' # Se ejecuta solo al modificar la carpeta lang

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para subir archivos a las Releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create "lang.zip"
        run: |
          cd lang
          zip lang.zip . -r
          cd ..

      - name: Move "latest" tag to current commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f latest
          git push -f origin latest

      - name: Get or create release for "latest" tag
        id: get_release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = "latest";
            let release;
            let lastError;      
            
            // Lógica de reintento para fallos temporales
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                release = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName
                });
                break; // Éxito, salimos del bucle de reintento
              } catch (error) {
                lastError = error;
                if (error.status === 404) {
                  // El release no existe, así que lo creamos
                  release = await github.rest.repos.createRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_name: tagName,
                    name: "Latest",
                    draft: false,
                    prerelease: false
                  });
                  break; // Éxito, salimos del bucle
                } else if (error.status >= 500) {
                  // Error del servidor, reintentamos después de una pausa
                  if (attempt < 2) {
                    await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
                    continue;
                  }
                } else {
                  // Otros errores, no reintentamos y lanzamos el error
                  throw error;
                }
              }
            }
            
            if (!release && lastError) {
              throw lastError;
            }
            
            core.setOutput('release_id', release.data.id);
            core.setOutput('upload_url', release.data.upload_url);

      - name: Delete old assets from release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ steps.get_release.outputs.release_id }};
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                per_page: 100
              }
            );
            const assetsToDelete = assets.filter(asset => 
              asset.name === 'lang.zip'
            );
            for (const asset of assetsToDelete) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
            }

      - name: Upload "lang.zip" archive
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./lang/lang.zip
          asset_name: lang.zip
